<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="red-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#e03131" flood-opacity="0.12"/>
    </filter>
    <filter id="sketch-filter" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pattern-hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2"/>
    </pattern>
    <pattern id="bg-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.65"/>
    </pattern>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 Z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 Z" fill="#e03131" />
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-hollow-triangle" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse">
      <polygon points="0,1.5 10.5,6 0,10.5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-filled-diamond" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
      <polygon points="0,6 6,1.5 12,6 6,10.5" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-hollow-diamond" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
      <polygon points="0,6 6,1.5 12,6 6,10.5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.6"/>
    </marker>
    <marker id="arrow-circle" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <circle cx="5" cy="5" r="3.5" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 500; fill: #94a3b8; }
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 700; font-size: 13px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 700; font-size: 19px; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 700; font-size: 16px; }
      .card-sub { font-family: "SF Mono", "Consolas", Menlo, monospace; font-size: 13px; }
      .mono-text { font-family: "SF Mono", "Consolas", Menlo, monospace; font-size: 13px; }
      .card-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 14.5px; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 12.5px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
      .cfg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 12.5px; font-weight: 700; fill: #c92a2a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" rx="14"/>
  <rect width="100%" height="100%" fill="url(#bg-grid)" rx="14"/>

  <g transform="translate(570, 48)" text-anchor="middle">
    <text class="title" font-size="28" y="0">Step 3 Gather 确定性探测与持久化决策流 (Dark 主题)</text>
    <text class="subtitle" font-size="15" y="28">零打扰复用优先级：显式参数 → 探活脚本 → 环境变量 → 持久化存储 → 交互弹窗</text>
  </g>

  <!-- Groups / Swimlanes -->
  
    <g transform="translate(40, 110)">
      <rect width="1060" height="230" rx="10" fill="rgba(30,41,59,0.45)" fill-opacity="0.55" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="6,5"/>
      
      <rect x="14" y="-13" width="294" height="26" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
      <text class="group-title" x="26" y="4" fill="#eef2ff">Swimlane A · 自动探测层 (0 UI 打扰)</text>
    </g>

    <g transform="translate(40, 365)">
      <rect width="1060" height="215" rx="10" fill="rgba(30,41,59,0.45)" fill-opacity="0.55" stroke="#2dd4bf" stroke-width="1.8" stroke-dasharray="6,5"/>
      
      <rect x="14" y="-13" width="258" height="26" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text class="group-title" x="26" y="4" fill="#f0fdfa">Swimlane B · 兜底交互与安全落盘</text>
    </g>

  <!-- Sequence Lifelines -->
  

