    <g transform="translate(935, 172)" filter="url(#shadow)" >
      <path d="M 0 13 L 0 87 A 70 13 0 0 0 140 87 L 140 13 Z" fill="#3b0764" stroke="#c084fc" stroke-width="2" />
      <ellipse cx="70" cy="13" rx="70" ry="13" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
      <text class="node-title" x="70" y="52" text-anchor="middle" fill="#faf5ff">fields.json</text>
      <text class="card-sub" x="70" y="72" text-anchor="middle" fill="#e9d5ff">.pi/orchestrator</text>
    </g>

    <g transform="translate(235, 435)" filter="url(#shadow)" >
      <polygon points="22,0 178,0 200,32 178,64 22,64 0,32" fill="#3b0764" stroke="#e879f9" stroke-width="2" />
      <text class="node-title" x="100" y="37" text-anchor="middle" fill="#fae8ff">ctx.ui.select / input</text>
    </g>

    <g transform="translate(495, 415)" filter="url(#shadow)" >
      <polygon points="85,0 170,52 85,104 0,52" fill="#450a0a" stroke="#f87171" stroke-width="2" />
      <text class="node-title" x="85" y="57" text-anchor="middle" fill="#fef2f2">secret === true?</text>
      
    </g>

    <g transform="translate(725, 436)" filter="url(#shadow)" >
      <rect width="205" height="62" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="2" />
      
      <text class="node-title" x="102.5" y="28" text-anchor="middle" fill="#fef2f2">内存传递 + 全局打码 ***</text>
      <text class="card-sub" x="102.5" y="48" text-anchor="middle" fill="#fecaca">严禁写入 fields.json</text>
    </g>

    <g transform="translate(965, 439)" filter="url(#shadow)" >
      <rect width="115" height="56" rx="28" fill="#064e3b" stroke="#34d399" stroke-width="2" />
      
      <text class="node-title" x="57.5" y="33" text-anchor="middle" fill="#ecfdf5">进入 Step 4</text>
    </g>

