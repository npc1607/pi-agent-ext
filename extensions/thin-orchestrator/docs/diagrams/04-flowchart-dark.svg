    <g transform="translate(65, 195)" filter="url(#shadow)" >
      <rect width="130" height="54" rx="27" fill="#134e4a" stroke="#2dd4bf" stroke-width="2" />
      
      <text class="node-title" x="65" y="32" text-anchor="middle" fill="#f0fdfa">开始 Gather</text>
    </g>

    <g transform="translate(240, 195)" filter="url(#shadow)" >
