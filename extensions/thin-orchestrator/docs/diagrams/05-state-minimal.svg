<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <filter id="red-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#e03131" flood-opacity="0.12"/>
    </filter>
    <filter id="sketch-filter" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pattern-hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3f3f46" stroke-width="1.2"/>
    </pattern>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 Z" fill="#3f3f46" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 Z" fill="#e03131" />
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#3f3f46" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-hollow-triangle" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse">
      <polygon points="0,1.5 10.5,6 0,10.5" fill="#fafafa" stroke="#3f3f46" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-filled-diamond" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
      <polygon points="0,6 6,1.5 12,6 6,10.5" fill="#3f3f46" stroke="#3f3f46" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-hollow-diamond" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto-start-reverse">
      <polygon points="0,6 6,1.5 12,6 6,10.5" fill="#fafafa" stroke="#3f3f46" stroke-width="1.6"/>
    </marker>
    <marker id="arrow-circle" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <circle cx="5" cy="5" r="3.5" fill="#3f3f46"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; fill: #18181b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 500; fill: #71717a; }
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 700; font-size: 13px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 700; font-size: 19px; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 700; font-size: 16px; }
      .card-sub { font-family: "SF Mono", "Consolas", Menlo, monospace; font-size: 13px; }
      .mono-text { font-family: "SF Mono", "Consolas", Menlo, monospace; font-size: 13px; }
      .card-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 14.5px; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 12.5px; font-weight: 600; fill: #27272a; text-anchor: middle; }
      .cfg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 12.5px; font-weight: 700; fill: #c92a2a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#fafafa" rx="14"/>
  

  <g transform="translate(570, 48)" text-anchor="middle">
    <text class="title" font-size="28" y="0">api-test 工作流状态机与门禁回环 (Minimal 主题)</text>
    <text class="subtitle" font-size="15" y="28">recon → inputs → design → plan → author ⇄ verify → review</text>
  </g>

  <!-- Groups / Swimlanes -->
  

  <!-- Sequence Lifelines -->
  

  <!-- Sequence Fragments -->
  
  <!-- Nodes & Cards -->
  
    <g transform="translate(45, 225)">
      <circle cx="14" cy="14" r="14" fill="#343a40"/>
    </g>

    <g transform="translate(115, 210)"  >
      <rect width="130" height="58" rx="29" fill="#f4f4f5" stroke="#52525b" stroke-width="2" />
      
      <text class="node-title" x="65" y="34" text-anchor="middle" fill="#18181b">1. recon</text>
    </g>

    <g transform="translate(290, 210)"  >
      <rect width="130" height="58" rx="29" fill="#f4f4f5" stroke="#52525b" stroke-width="2" />
      
      <text class="node-title" x="65" y="34" text-anchor="middle" fill="#18181b">2. inputs</text>
    </g>

    <g transform="translate(465, 210)"  >
      <rect width="155" height="58" rx="29" fill="#f4f4f5" stroke="#52525b" stroke-width="2" />
      
      <text class="node-title" x="77.5" y="34" text-anchor="middle" fill="#18181b">3. design &amp; plan</text>
    </g>

    <g transform="translate(670, 210)"  >
      <rect width="145" height="58" rx="29" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" />
      
      <text class="node-title" x="72.5" y="34" text-anchor="middle" fill="#1864ab">4. author</text>
    </g>

    <g transform="translate(920, 198)"  >
      <ellipse cx="82.5" cy="41" rx="82.5" ry="41" fill="#ebfbee" stroke="#0ca678" stroke-width="2" />
      <text class="node-title" x="82.5" y="39" text-anchor="middle" fill="#087f5b">5. verify</text>
      <text class="card-sub" x="82.5" y="57" text-anchor="middle" fill="#495057">runner + coverage</text>
    </g>

    <g transform="translate(925, 365)"  >
      <rect width="155" height="58" rx="29" fill="#f4f4f5" stroke="#52525b" stroke-width="2" />
      
      <text class="node-title" x="77.5" y="34" text-anchor="middle" fill="#18181b">6. review</text>
    </g>

    <g transform="translate(750, 378)">
      <circle cx="16" cy="16" r="16" fill="none" stroke="#343a40" stroke-width="2"/>
      <circle cx="16" cy="16" r="9.6" fill="#343a40"/>
    </g>

  <!-- Edges & Arrows -->
  
    <g>
      <path d="M 73 239 L 115 239" fill="none" stroke="#3f3f46" stroke-width="2.1"   marker-end="url(#arrow-gray)"/>
      
    </g>

    <g>
      <path d="M 245 239 L 290 239" fill="none" stroke="#3f3f46" stroke-width="2.1"   marker-end="url(#arrow-gray)"/>
      
    </g>

    <g>
      <path d="M 420 239 L 465 239" fill="none" stroke="#3f3f46" stroke-width="2.1"   marker-end="url(#arrow-gray)"/>
      
    </g>

    <g>
      <path d="M 620 239 L 670 239" fill="none" stroke="#3f3f46" stroke-width="2.1"   marker-end="url(#arrow-gray)"/>
      
    </g>

    <g>
      <path d="M 815 239 L 920 239" fill="none" stroke="#3f3f46" stroke-width="2.1"   marker-end="url(#arrow-gray)"/>
      
      <rect x="831.5" y="228" width="72" height="22" rx="5" fill="#f4f4f5" stroke="#dee2e6"/>
      <text class="tag-text" x="867.5" y="243" text-anchor="middle">套件生成</text>
    </g>

    <g>
      <path d="M 1002.5 198 C 1002.5 123, 742.5 123, 742.5 210" fill="none" stroke="#e03131" stroke-width="2.1" stroke-dasharray="6,5"  marker-end="url(#arrow-red)"/>
      
      <rect x="688" y="132.25" width="369" height="22" rx="5" fill="#ffe3e3" stroke="#ffa8a8"/>
      <text class="cfg-text" x="872.5" y="147.25" text-anchor="middle">onGateFail: 漏测或断言失败 (retryFrom: author)</text>
    </g>

    <g>
      <path d="M 1002.5 280 L 1002.5 365" fill="none" stroke="#3f3f46" stroke-width="2.1"   marker-end="url(#arrow-gray)"/>
      
      <rect x="975.5" y="311.5" width="54" height="22" rx="5" fill="#f4f4f5" stroke="#dee2e6"/>
      <text class="tag-text" x="1002.5" y="326.5" text-anchor="middle">PASS</text>
    </g>

    <g>
      <path d="M 925 394 L 782 394" fill="none" stroke="#3f3f46" stroke-width="2.1"   marker-end="url(#arrow-gray)"/>
      
      <rect x="826.5" y="383" width="54" height="22" rx="5" fill="#f4f4f5" stroke="#dee2e6"/>
      <text class="tag-text" x="853.5" y="398" text-anchor="middle">Done</text>
    </g>

